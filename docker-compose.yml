services:
  app:
    build: .
    container_name: bstni-api
    ports:
      - '1337:1337'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mydb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: bash -c "npx prisma migrate reset --force && yarn seed && yarn start:prod"

  postgres:
    image: postgres
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: always
    ports:
      - '8080:8080'
    environment:
      NC_ADMIN_EMAIL: admin@binga.local
      NC_ADMIN_PASSWORD: admin123
      NC_PUBLIC_URL: 'https://testing.binga.network/noco'

    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
  nocodb-data:
